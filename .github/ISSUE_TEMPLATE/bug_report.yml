name: Bug report
description: Report a problem with the Nuvio CLI
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This is an unofficial community project, not affiliated with Nuvio.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Run nuvio --version or provide the commit SHA.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: output of `node -v`
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: CLI stderr or JSON output. Remove secrets first.
      render: shell
    validations:
      required: false
